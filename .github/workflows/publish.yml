name: Publish Revenge plugin index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dev-local-timestamp-editor-plugin-*.zip'
      - '.github/scripts/generate_index.py'
      - '.github/workflows/publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ZIPs and regenerate index.json
        run: python3 .github/scripts/generate_index.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Regenerate index.json"
          git push
